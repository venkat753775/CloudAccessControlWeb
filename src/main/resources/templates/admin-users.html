<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
        }

        .header {
            background: #1e293b;
            color: white;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Admin - User Management</h1>

    <a href="/dashboard" class="back">
        Dashboard
    </a>

</div>

<div class="container">

    <div class="card">

        <h2>Registered Users</h2>

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Change Role</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.id}">
                    1
                </td>

                <td th:text="${user.username}">
                    user
                </td>

                <td th:text="${user.role}">
                    USER
                </td>

                <td>

                    <form
                        th:action="@{/admin/users/{id}/role(id=${user.id})}"
                        method="post">

                        <select name="role">

                            <option value="USER"
                                    th:selected="${user.role == 'USER'}">
                                USER
                            </option>

                            <option value="ADMIN"
                                    th:selected="${user.role == 'ADMIN'}">
                                ADMIN
                            </option>

                        </select>

                        <button type="submit">
                            Update
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
